<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="PayRadar — Track recurring payments (rent, bills, subscriptions) privately. Verileriniz cihazınızda şifreli kalır. / Your data stays encrypted on your device."
    />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)" />
    <!-- Yerel form denetimleri ve kaydırma çubukları temayla uyumlu çizilsin -->
    <meta name="color-scheme" content="light dark" />
    <!-- Ana ekrana eklenince tam ekran açılsın (iOS hâlâ bu etiketi istiyor;
         Android karşılığı mobile-web-app-capable). Durum çubuğu rengini
         bilerek black-translucent'a çekmedik: o beyaz metni zorlar ve açık
         temada okunmaz olurdu; varsayılan hâlde iOS yukarıdaki theme-color'ı
         kullanır, yani iki temada da doğru kontrast çıkar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PayRadar" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script src="./boot-lang.js"></script>
    <title>PayRadar — Düzenli Ödeme Takibi</title>
  </head>
  <body>
    <div id="root">
      <!-- React yüklenemezse eski WebView kullanıcıları boş ekran görmesin. -->
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font:16px system-ui,sans-serif;background:#07080c;color:#eef0f4">
        <div>
          <h1 style="font-size:20px;margin:0 0 10px">PayRadar açılıyor…</h1>
          <p style="margin:0 0 18px;color:#a7adba">Telefonunuzda eski önbellek varsa güncel sürümü açın.</p>
          <a href="./?update=1" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#45f0ae;color:#07110d;font-weight:700;text-decoration:none">Güncel sürümü aç</a>
        </div>
      </div>
    </div>
    <script src="./boot-recovery.js"></script>
    <!-- Relative path is required when the app is hosted under a subpath or opened by a TWA/WebView. -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
