workflows:
  ios-workflow:
    name: PayRadar iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: payradar_appstore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.vercel.payradar-pink
      vars:
        XCODE_WORKSPACE: "PayRadar.xcworkspace"
        XCODE_SCHEME: "PayRadar"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          cd ios
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
